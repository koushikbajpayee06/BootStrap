<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</head>
<body class="p-4">
    <div class="carousel carousel-fade" data-bs-theme="dark" data-bs-ride="carousel" id="banners">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="../public/images/c4.png" height="300" class="w-100 d-block">
            </div>
            <div class="carousel-item">
                <img src="../public/images/c3.png" height="300" class="w-100 d-block">
            </div>
            <div class="carousel-item">
                <img src="../public/images/c2.png" height="300" class="w-100 d-block">
            </div>
            <div class="carousel-item">
                <img src="../public/images/c1.png" height="300" class="w-100 d-block">
            </div>
        </div>
        <button class="carousel-control-prev"  data-bs-slide="prev" data-bs-target="#banners">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next"  data-bs-slide="next" data-bs-target="#banners">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</body>
</html>
