<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</head>
<body class="p-4">
    <div class="carousel carousel-fade" data-bs-theme="dark" data-bs-ride="carousel" id="banners">
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="14000">
                <img src="../public/images/c4.png" class="w-100 d-block" height="200">
            </div>
            <div class="carousel-item" data-bs-interval="1000">
                <img src="../public/images/c3.png" class="w-100 d-block" height="200">
            </div>
            <div class="carousel-item" data-bs-interval="4000">
                <div class="d-flex justify-content-center align-items-center " style="height: 300px;">
                    <div>
                        <form class="input-group input-group-lg">
                            <input type="text" class="form-control" placeholder="Your email address">
                            <button class="btn btn-danger">Get Started<span class="bi bi-chevron-right"></span></button>
                        </form>
                </div>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="4000">
                <img src="../public/images/c1.png" class="w-100 d-block" height="200">
            </div>
        </div>
        <button class="carousel-control-prev" data-bs-target="#banners" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" data-bs-target="#banners" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
        <div class="carousel-indicators">
            <button data-bs-slide-to="0" data-bs-target="#banners" class="active"></button>
            <button data-bs-slide-to="1" data-bs-target="#banners"></button>
            <button data-bs-slide-to="2" data-bs-target="#banners"></button>
            <button data-bs-slide-to="3" data-bs-target="#banners"></button>
        </div>
    </div>
    
</body>
</html>
